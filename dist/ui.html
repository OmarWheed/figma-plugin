.row{display:flex;gap:16px;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:64px;z-index:40;transform:translate(-50%,12px);max-width:calc(100% - 24px);padding:8px 12px;border-radius:8px;background:#1e1e1e;color:#fff;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}

  <button id="open-settings" class="icon-btn" type="button" aria-label="Settings" title="Settings"></button>
