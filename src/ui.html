<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Flutter Assets Exporter</title><style>
:root{
  --bg:var(--figma-color-bg,#fff);--bg-2:var(--figma-color-bg-secondary,#f5f5f5);--bg-3:var(--figma-color-bg-tertiary,#e9e9e9);

}
html.figma-dark{--checker-a:#2a2a2a;--checker-b:#353535;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 16px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;overflow:hidden;font:12px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--brand);outline-offset:1px}

.muted{color:var(--fg-2)}
/* Header */
.top{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}

.brand-text{min-width:0}

.btn{height:30px;padding:0 12px;border-radius:6px;border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;white-space:nowrap;transition:background-color .15s,border-color .15s,transform .08s,opacity .15s}

.btn.primary{background:var(--brand);color:var(--on-brand)}
.btn.primary:hover:not(:disabled){background:var(--brand-hover)}
.btn.secondary{background:var(--bg);border-color:var(--border-strong)}
.btn.secondary:hover:not(:disabled){background:var(--bg-hover)}
.btn svg,.icon-btn svg{width:16px;height:16px;flex:none}
.icon-btn{width:30px;height:30px;border:0;border-radius:6px;background:transparent;display:grid;place-items:center;color:var(--fg-2);transition:background-color .15s,color .15s}
.icon-btn:hover{background:var(--bg-hover);color:var(--fg)}
.link-btn{border:0;background:none;padding:0;color:var(--brand-fg);font-weight:500}
.link-btn:hover{text-decoration:underline}

.progress{padding:8px 12px 10px;border-bottom:1px solid var(--border);background:var(--bg)}
.progress-track{height:4px;border-radius:4px;background:var(--bg-3);overflow:hidden;position:relative}

@keyframes slide{from{left:-30%}to{left:100%}}
.progress-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px;color:var(--fg-2)}

.tabs{display:flex;gap:2px;padding:0 8px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tab{position:relative;border:0;background:none;padding:10px 8px 9px;color:var(--fg-2);font-weight:500;display:flex;align-items:center;gap:5px;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab[aria-selected=true]{color:var(--fg)}
.tab[aria-selected=true]::after{content:"";position:absolute;left:6px;right:6px;bottom:-1px;height:2px;border-radius:2px;background:var(--fg)}
.count{min-width:18px;padding:0 5px;border-radius:9px;background:var(--bg-2);color:var(--fg-2);font-size:10px;line-height:16px;text-align:center}

.search{flex:1;min-width:80px;position:relative}
.search svg{position:absolute;left:8px;top:50%;width:14px;height:14px;transform:translateY(-50%);color:var(--fg-3);pointer-events:none}

.search input:focus{border-color:var(--brand)}
.select{height:28px;border:1px solid var(--border);border-radius:6px;background:var(--bg);padding:0 6px}
.seg{display:inline-flex;padding:2px;border-radius:7px;background:var(--bg-2);gap:2px}
.seg button{border:0;background:none;height:24px;min-width:26px;padding:0 6px;border-radius:5px;color:var(--fg-2);display:grid;place-items:center}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed=true]{background:var(--bg);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.check-all{display:flex;align-items:center;gap:5px;color:var(--fg-2);white-space:nowrap;cursor:pointer}
/* Content */
.content{flex:1;overflow:auto;position:relative;scroll-behavior:smooth}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;padding:12px}
.card{position:relative;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);overflow:hidden;cursor:pointer;outline:none;content-visibility:auto;contain-intrinsic-size:150px;transition:border-color .15s,box-shadow .2s,transform .2s;animation:pop .25s ease both}
.card:hover,.card:focus-visible{border-color:var(--brand);box-shadow:var(--shadow);transform:translateY(-1px)}
.card.off{opacity:.5}
.card.off .thumb img{filter:grayscale(1)}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.thumb{aspect-ratio:1;display:grid;place-items:center;padding:14px;border-bottom:1px solid var(--border)}
.thumb img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;opacity:0;transition:opacity .25s}
.thumb img.ready{opacity:1}
.thumb.svg img{width:72%;height:72%}
.bg-checker{background-color:var(--checker-a);background-image:var(--checker);background-size:12px 12px;background-position:0 0,6px 6px}
.bg-light{background:#fff}
.bg-dark{background:#1d1d1d}
.meta{padding:7px 8px 8px}
.name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--fg-2);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.check{position:absolute;top:6px;left:6px;z-index:2;display:grid;place-items:center;width:20px;height:20px;cursor:pointer}
.check input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.check span{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--border-strong);background:var(--bg);display:grid;place-items:center;transition:background-color .15s,border-color .15s}

.check input:checked+span::after{content:"";width:8px;height:4px;border:2px solid var(--on-brand);border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}

.card .check{opacity:0;transition:opacity .15s}
.card:hover .check,.card:focus-within .check,.card.off .check,.swatch .check,.text-row .check{opacity:1}
.badges{position:absolute;top:6px;right:6px;z-index:2;display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end;max-width:70%}
.badge{height:18px;padding:0 5px;border-radius:9px;background:rgba(30,30,30,.78);color:#fff;font-size:10px;font-weight:600;display:inline-flex;align-items:center;gap:2px;backdrop-filter:blur(4px)}
.badge.fx{background:#7c4dff}
.badge.similar{background:#00897b}
.dot{width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 1px rgba(255,255,255,.7)}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:14px 12px 0;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--fg-2)}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;padding:10px 12px 4px}
.swatch{position:relative;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;background:var(--bg);outline:none;transition:border-color .15s,box-shadow .2s,transform .2s;animation:pop .25s ease both}

.swatch.off{opacity:.5}
.chip{height:58px;background-image:linear-gradient(var(--c),var(--c)),var(--checker);background-size:auto,10px 10px,10px 10px;background-position:0 0,0 0,5px 5px;background-color:var(--checker-a);border-bottom:1px solid var(--border)}
.grad-chip{height:58px;background-image:var(--g),var(--checker);background-size:auto,10px 10px,10px 10px;background-position:0 0,0 0,5px 5px;background-color:var(--checker-a);border-bottom:1px solid var(--border)}
.swatch .meta .sub code{font-size:10.5px}
.text-list{padding:6px 12px 12px;display:grid;gap:8px}
.text-row{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px 10px 38px;border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;outline:none;transition:border-color .15s,box-shadow .2s;animation:pop .25s ease both}
.text-row:hover,.text-row:focus-visible{border-color:var(--brand);box-shadow:var(--shadow)}
.text-row.off{opacity:.5}
.text-row .check{top:50%;left:10px;transform:translateY(-50%)}
.sample{font-size:22px;line-height:1.1;min-width:44px;text-align:center}
.uses{color:var(--fg-3);font-size:11px;white-space:nowrap}
.skipped{padding:6px 12px 12px;display:grid;gap:8px}
.skipped details{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.skipped summary{padding:9px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-weight:500;list-style:none}
.skipped summary::-webkit-details-marker{display:none}
.skipped summary::before{content:"▸";color:var(--fg-3);margin-right:6px;transition:transform .15s;display:inline-block}
.skipped details[open] summary::before{transform:rotate(90deg)}
.skipped ul{margin:0;padding:0 0 4px;list-style:none;max-height:240px;overflow:auto}
.skipped li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 12px;border-top:1px solid var(--border)}
.skipped li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Empty, error and loading states */
.empty{max-width:360px;margin:0 auto;padding:36px 20px;text-align:center;animation:pop .3s ease both}
.empty h2{font-size:14px;margin:12px 0 6px}
.empty p{color:var(--fg-2);margin:0 0 14px}
.empty ul{text-align:left;margin:0;padding:12px 14px 12px 30px;border-radius:var(--radius);background:var(--bg-2);color:var(--fg-2)}
.empty li+li{margin-top:6px}
.empty .art{width:96px;height:76px;margin:0 auto;color:var(--brand)}
.error{margin:16px 12px;padding:12px 14px;border-radius:var(--radius);border:1px solid var(--danger);color:var(--danger);background:var(--bg)}

.none{padding:30px 12px;text-align:center;color:var(--fg-2)}

.bottom{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--border);background:var(--bg)}
.summary{flex:1;min-width:0;color:var(--fg-2)}
.summary b{color:var(--fg);font-weight:600}
.summary .line{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.summary .hint{font-size:11px;color:var(--fg-3)}
/* Overlays */
.overlay{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;animation:fade .16s ease both}
@keyframes fade{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
.v-head{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 12px;border-bottom:1px solid var(--border)}
.name-input{flex:1;min-width:0;height:30px;padding:0 8px;border:1px solid transparent;border-radius:6px;background:transparent;font-weight:600;font-size:13px;outline:none;transition:border-color .15s,background-color .15s}
.name-input:hover{border-color:var(--border)}
.name-input:focus{border-color:var(--brand);background:var(--bg)}
.pill{padding:2px 8px;border-radius:10px;background:var(--bg-2);color:var(--fg-2);font-size:11px;white-space:nowrap}
.stage{position:relative;flex:1;min-height:140px;overflow:auto;display:grid;place-items:center;padding:24px}
.stage img{display:block;image-rendering:auto}
.stage.fit img{width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain}
.stage.actual img{width:auto;height:auto;max-width:none;max-height:none}
.stage .nav{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:30px;height:44px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--fg);display:grid;place-items:center;opacity:.85;box-shadow:var(--shadow)}
.stage .nav:hover{opacity:1}
.stage .nav:disabled{opacity:.25;cursor:default}
.stage .prev{left:8px}.stage .next{right:8px}
.stage-tools{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--bg-2)}
.info{padding:10px 12px;display:grid;gap:8px;overflow:auto;max-height:45%}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.fact{padding:7px 9px;border-radius:6px;background:var(--bg-2)}
.fact span{display:block;color:var(--fg-2);font-size:10.5px}
.fact b{font-weight:600}
.code-row{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 9px;border-radius:6px;border:1px solid var(--border);min-width:0}
.code-row code{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.code-row .label{color:var(--fg-3);font-size:10.5px;width:44px;flex:none}
.copy{border:0;background:var(--bg-2);border-radius:5px;height:24px;padding:0 8px;color:var(--fg-2);font-size:11px;font-weight:500;flex:none}
.copy:hover{background:var(--bg-3);color:var(--fg)}
.notes{margin:0;padding:8px 10px 8px 26px;border-radius:6px;background:var(--brand-soft);color:var(--fg)}
.notes li+li{margin-top:3px}
.v-actions{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--border)}
.v-actions .spacer{flex:1}
.toggle{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.color-hero{height:120px;margin:12px;border-radius:10px;border:1px solid var(--border);background-image:linear-gradient(var(--c),var(--c)),var(--checker);background-size:auto,14px 14px,14px 14px;background-position:0 0,0 0,7px 7px;background-color:var(--checker-a);display:flex;align-items:flex-end;padding:10px;font-weight:600}
.color-hero span{padding:3px 8px;border-radius:6px;background:rgba(255,255,255,.85);color:#111}
.text-preview{margin:12px;padding:16px;border-radius:10px;border:1px solid var(--border);overflow:hidden;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{display:inline-flex;align-items:center;gap:5px;padding:2px 8px 2px 4px;border-radius:10px;background:var(--bg-2);font-size:11px}
.chips i{width:12px;height:12px;border-radius:50%;border:1px solid var(--border)}
/* Settings */
.sheet-body{flex:1;overflow:auto;padding:4px 14px 16px}
.sheet-body h3{margin:16px 0 4px;font-size:12px}
.hint{margin:0 0 8px;color:var(--fg-2);font-size:11px}
.option{display:flex;gap:10px;align-items:flex-start;padding:8px 0;cursor:pointer}
.option input{margin:2px 0 0;accent-color:var(--brand)}
.option small{display:block;color:var(--fg-2);font-size:11px}
.row{display:flex;gap:16px;flex-wrap:wrap}
/* Toast and resize grip */
.toast{position:fixed;left:50%;bottom:64px;z-index:40;transform:translate(-50%,12px);max-width:calc(100% - 24px);padding:8px 12px;border-radius:8px;background:#1e1e1e;color:#fff;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.error{background:var(--danger)}
.grip{position:fixed;right:0;bottom:0;z-index:50;width:14px;height:14px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 50%,var(--fg-3) 50%,var(--fg-3) 58%,transparent 58%,transparent 70%,var(--fg-3) 70%,var(--fg-3) 78%,transparent 78%);opacity:.6}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body>
<header class="top">
